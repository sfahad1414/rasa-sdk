[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rasa-sdk"
version = "3.13.0.dev1"
description = "Open source machine learning framework to automate text- and voice-based conversations: NLU, dialogue management, connect to Slack, Facebook, and more - Create chatbots and voice assistants"
authors = [
    {name = "Rasa Technologies GmbH", email = "hi@rasa.com"}
]
maintainers = [
    {name = "Tom Bocklisch", email = "tom@rasa.com"}
]
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries"
]
keywords = [
    "nlp", "machine-learning", "machine-learning-library", "bot", "bots",
    "botkit", "rasa conversational-agents", "conversational-ai", "chatbot",
    "chatbot-framework", "bot-framework"
]
requires-python = "==3.12.*"
dependencies = [
    "coloredlogs==15.0.1",
    "sanic==25.12.1",
    "typing-extensions==4.16.0",
    "Sanic-Cors==2.2.0",
    "ruamel.yaml==0.19.1",
    "websockets==17.1",
    "pluggy==1.6.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-jaeger-thrift==1.21.0",
    "deprecated==1.3.1",
    "opentelemetry-exporter-otlp==1.45.0",
    "grpcio==1.84.0",
    "protobuf==7.36.2",
    "pydantic==2.13.5",
    "grpcio-health-checking==1.84.0",
    "grpcio-tools==1.84.0"
]

[project.urls]
homepage = "https://rasa.com"
repository = "https://github.com/rasahq/rasa-sdk"
documentation = "https://rasa.com/docs"

[project.optional-dependencies]
dev = [
    "pytest-cov>=7.1.0",
    "coveralls>=4.1.0",
    "pytest>=9.1.1",
    "questionary>=2.1.1",
    "towncrier>=26.9.0",
    "toml>=0.10.2",
    "pep440-version-utils>=1.2.0",
    "semantic_version>=2.10.0",
    "mypy>=2.3.1",
    "sanic-testing>=24.6.0",
    "ruff>=0.16.9",
    "pytest-asyncio>=1.4.0",
    "types-protobuf>=7.35.1.20260906"
]

[tool.uv]
package = true
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.setuptools.packages.find]
include = ["rasa_sdk*"]

[tool.mypy]
ignore_missing_imports = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "rasa_sdk/grpc_py"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    "rasa_sdk/grpc_py",
    "eggs",
    ".git",
    ".pytest_cache",
    "build",
    "dist",
    ".DS_Store"
]

[tool.towncrier]
package = "rasa_sdk"
package_dir = "rasa_sdk"
filename = "CHANGELOG.mdx"
directory = "./changelog"
underlines = "   "
title_format = "## [{version}] - {project_date}"
template = "./changelog/_template.md.jinja2"
start_string = "<!-- TOWNCRIER -->\n"
issue_format = "[#{issue}](https://github.com/rasahq/rasa-sdk/issues/{issue})"

[[tool.towncrier.type]]
directory = "removal"
name = "Deprecations and Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "improvement"
name = "Improvements"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Improved Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous internal changes"
showcontent = false

[tool.pytest.ini_options]
python_functions = "test_"
asyncio_mode = "auto"

[tool.ruff.lint]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "RUF005"]
select = ["D", "E", "F", "W", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"
